name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        env:
          # Tests sur fork : il faut un RPC qui garde l'historique. Le secret est prioritaire s'il existe.
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://gateway.tenderly.co/public/sepolia' }}
        run: forge test -vvv
