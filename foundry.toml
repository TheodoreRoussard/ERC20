[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Sepolia est passé au hard fork Amsterdam : sans ce réglage, Forge sous-estime le gas.
evm_version = "amsterdam"
# AllInOne embarque le bytecode de MyToken : sans optimisation, son déploiement (21,6M gas)
# dépasse la limite de 16,7M gas par transaction. Avec : environ 10,6M.
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
